receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s, 120s]
    dimensions:
      - name: gen_ai.system
      - name: gen_ai.request.model
      - name: gen_ai.operation.name
    # Produces metrics named like:
    #   calls_total        (counter of span count)
    #   duration_milliseconds (histogram of span duration)
    exemplars:
      enabled: true
    namespace: pi

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  
  resource:
    attributes:
      - key: service.instance.id
        from_attribute: host.name
        action: insert

exporters:
  # Send traces to Tempo
  otlp_grpc/tempo:
    endpoint: http://tempo:4317
    tls:
      insecure: true
  otlphttp/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true
  
  # Expose metrics for Prometheus to scrape (span-derived + any native OTLP metrics)
  prometheus:
    endpoint: "0.0.0.0:9999"
    namespace: openclaw
  
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

  # Debug output
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      # spanmetrics connector acts as an exporter in the traces pipeline
      exporters: [otlp_grpc/tempo, spanmetrics, debug]
    
    metrics:
      # spanmetrics connector acts as a receiver in the metrics pipeline,
      # plus keep otlp for any future native metrics from pi or extensions
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp_http/loki, debug]
  
  # OTEL Collector's own internal telemetry (v0.123.0+ syntax)
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
