server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: openclaw-gateway
    static_configs:
      - targets: [localhost]
        labels:
          job: openclaw-gateway
          service_name: openclaw-gateway
          host: clawd
          format: v2
          __path__: /var/log/openclaw/*.log
    pipeline_stages:
      - json:
          expressions:
            ts: time
            level: _meta.logLevelName
            m0: '"0"'
            m1: '"1"'
            m2: '"2"'
      - timestamp:
          source: ts
          format: RFC3339Nano
      - labels:
          level:
      - template:
          source: formatted
          template: '{{ .ts }} [{{ .level }}] {{ if .m2 }}{{ .m2 }}{{ else if .m1 }}{{ .m1 }}{{ else if .m0 }}{{ .m0 }}{{ else }}log{{ end }}'
      - output:
          source: formatted
