global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape the OTEL Collector's own internal telemetry
  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'otel-collector'
  
  # Scrape OpenClaw metrics (forwarded through OTEL Collector)
  - job_name: 'openclaw'
    static_configs:
      - targets: ['otel-collector:9999']
        labels:
          service: 'openclaw'
  
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  # Scrape Tempo
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
  
  # Scrape Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # Pi metrics disabled (host target currently unavailable)
  # - job_name: 'pi-metrics'
  #   static_configs:
  #     - targets: ['172.17.0.1:9091']
